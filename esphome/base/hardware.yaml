# Board, panel, touch, keys, battery and frontlight. Fonts are NOT here: they are
# generated from panel.yaml so only the glyphs you actually use reach flash.
packages:
  board: github://vjFaLk/esphome-xteink/packages/x4_pro.yaml@7ea36f1a8be450b865179b43e9eb95ac1b50359b

external_components:
  # Vendored copy of vjFaLk/esphome-xteink (see components/xteink/UPSTREAM_COMMIT)
  # plus the patches in ../patches; re-vendor with scripts/sync-xteink.sh.
  - source:
      type: local
      path: components
    components: [xteink]

xteink:
  id: xteink_hub
  update_interval: 20ms   # input poll (buttons, GT911 touch); upstream default 50 ms

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # No logging over USB serial: ESPHome's USB-Serial-JTAG driver storms (interrupt
  # watchdog, crash loop surviving resets) when the cable is replugged while running.
  # Logs are available over Wi-Fi: tools/panel logs
  baud_rate: 0

display:
  - platform: xteink
    id: epd
    update_interval: never   # LVGL drives refreshes via on_draw_end
    auto_clear_enabled: false

touchscreen:
  - platform: xteink
    id: tp
    # No transform: the touchscreen delivers panel-native 800x480 coordinates and
    # LVGL's rotation (base/ui.yaml) rotates input points itself.
    update_interval: 20ms
    on_touch:
      - script.execute: inactivity
      - script.execute: idle_timer

binary_sensor:
  - platform: xteink
    id: xteink_buttons
    update_interval: 20ms
    up:    { id: btn_up,    name: Left key }
    down:
      id: btn_down
      name: Right key
      on_press:   # quick action: frontlight on/off (restores last brightness and warmth)
        - script.execute: inactivity
        - script.execute: idle_timer
        - light.toggle: { id: frontlight, transition_length: 0s }
    power: { id: btn_power, name: Power key }
    home:
      id: btn_home
      name: Home key
      on_press:
        - script.execute: inactivity
        - script.execute: idle_timer
        - lvgl.page.show: page_home

sensor:
  - platform: xteink
    battery_level:
      id: battery_level
      name: Battery
      on_value:
        # A changed battery number is a real (small) refresh but leaves no ghosting
        # worth a clearing flash, so it is excluded from the ghost-cleanup count.
        # The status line is on the top layer, so this happens on every page.
        - lambda: |-
            const int shown = (int) lroundf(x);
            if (shown != id(battery_shown)) {
              id(battery_shown) = shown;
              id(clean_mark)++;
            }
        - lvgl.widget.refresh: status_bar
    battery_voltage: { id: battery_voltage, name: Battery voltage }

light:
  - platform: xteink
    id: frontlight
    name: Frontlight
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
